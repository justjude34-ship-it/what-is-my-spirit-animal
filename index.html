<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Is My Spirit Animal?</title>
<meta name="description" content="Answer five questions and discover your spirit animal.">
<meta name="theme-color" content="#1a120b">
<link rel="manifest" href="data:application/manifest+json,{'name':'What Is My Spirit Animal','short_name':'Spirit Animal','start_url':'.','display':'standalone','background_color':'#1a120b','theme_color':'#1a120b'}">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background:#1a120b; color:#f3e9d7; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; text-align:center; padding:28px 16px 8px; }
  header h1 { font-size:1.7rem; letter-spacing:1px; color:#e8c98a; }
  header p { color:#b9a88a; font-size:0.95rem; margin-top:6px; }
  .cover { width:100%; max-width:640px; margin:12px auto 0; border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .cover img { display:block; width:100%; height:auto; }
  main { width:100%; max-width:640px; padding:20px 16px 40px; flex:1; }
  .progress { height:6px; background:#3a2e22; border-radius:3px; margin-bottom:22px; overflow:hidden; }
  .progress > div { height:100%; width:0; background:linear-gradient(90deg,#c98a3a,#e8c98a); transition:width .4s ease; }
  .q { font-size:1.25rem; line-height:1.45; margin-bottom:18px; }
  .answers { display:flex; flex-direction:column; gap:10px; }
  .answers button { background:#2a2118; color:#f3e9d7; border:1px solid #4a3b2a; border-radius:10px; padding:14px 16px; text-align:left; font-size:1rem; cursor:pointer; transition:background .2s, border-color .2s; }
  .answers button:hover { background:#3a2e22; border-color:#c98a3a; }
  .result { text-align:center; padding:10px 0; }
  .result .emoji { font-size:3.5rem; margin-bottom:8px; }
  .result h2 { font-size:2rem; color:#e8c98a; margin-bottom:6px; }
  .result .tag { color:#b9a88a; font-style:italic; margin-bottom:18px; }
  .result p { line-height:1.6; margin-bottom:14px; }
  .result .shadow { color:#c9a88a; font-size:.95rem; }
  .btns { display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .btns button { background:#c98a3a; color:#1a120b; border:none; border-radius:10px; padding:12px 22px; font-size:1rem; font-weight:bold; cursor:pointer; }
  .btns button.secondary { background:transparent; color:#e8c98a; border:1px solid #c98a3a; }
  .start { text-align:center; padding:30px 10px; }
  .start button { background:#c98a3a; color:#1a120b; border:none; border-radius:12px; padding:16px 40px; font-size:1.15rem; font-weight:bold; cursor:pointer; letter-spacing:.5px; }
  .start button:hover { background:#e8c98a; }
  footer { color:#6b5a45; font-size:.75rem; padding:10px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>What Is My Spirit Animal?</h1>
  <p>Five questions. One animal. Discover yours.</p>
</header>
<div class="cover">
  <img src="data:image/jpeg;base64,PLACEHOLDER" alt="Wolf at dusk on a ridge">
</div>
<main id="app"></main>
<footer>What Is My Spirit Animal &middot; a single-file quiz</footer>
<script>
const QUESTIONS = [
  { q: "When plans fall apart, what do you do?", a: [
    { t: "Adapt fast and find a new way", animal: "fox" },
    { t: "Get frustrated, then quietly rebuild", animal: "bear" },
    { t: "Stick to the original plan anyway", animal: "beaver" },
    { t: "Ask the group what to do", animal: "wolf" }
  ]},
  { q: "In a group, you are usually the one who...", a: [
    { t: "Leads and decides", animal: "eagle" },
    { t: "Listens and supports", animal: "wolf" },
    { t: "Does your own thing", animal: "cat" },
    { t: "Keeps everyone connected", animal: "dolphin" }
  ]},
  { q: "How do you recharge?", a: [
    { t: "Alone, in quiet", animal: "owl" },
    { t: "With a few close people", animal: "dolphin" },
    { t: "In a crowd, the bigger the better", animal: "meerkat" },
    { t: "Out in nature", animal: "deer" }
  ]},
  { q: "When someone is upset, you tend to...", a: [
    { t: "Fix the problem", animal: "badger" },
    { t: "Sit with them and listen", animal: "elephant" },
    { t: "Give them space", animal: "deer" },
    { t: "Cheer them up with humor", animal: "dolphin" }
  ]},
  { q: "Under pressure, your instinct is to...", a: [
    { t: "Confront it head-on", animal: "tiger" },
    { t: "Get out of there", animal: "hare" },
    { t: "Stay calm and wait it out", animal: "turtle" },
    { t: "Think it through before acting", animal: "owl" }
  ]}
];
const ANIMALS = {
  fox: { name:"Fox", emoji:"🦊", tag:"The quick-witted survivor", strength:"You read a room fast and thrive on change.", shadow:"You can scatter when things get too deep." },
  bear: { name:"Bear", emoji:"🐻", tag:"The steady protector", strength:"You rebuild quietly and guard what matters.", shadow:"Your frustration can rumble before you speak." },
  beaver: { name:"Beaver", emoji:"🦫", tag:"The patient builder", strength:"You work steadily toward long-term goals.", shadow:"You can get stuck when plans must change." },
  eagle: { name:"Eagle", emoji:"🦅", tag:"The natural leader", strength:"You see the big picture and decide with confidence.", shadow:"You can soar above the details others need." },
  wolf: { name:"Wolf", emoji:"🐺", tag:"The loyal packmate", strength:"You listen before acting and lead by example.", shadow:"You can lose yourself in the pack's needs." },
  cat: { name:"Cat", emoji:"🐱", tag:"The independent spirit", strength:"You do things your own way, self-sufficient.", shadow:"You can shut people out when you need space." },
  owl: { name:"Owl", emoji:"🦉", tag:"The quiet observer", strength:"You recharge alone and see what others miss.", shadow:"You can overthink instead of acting." },
  dolphin: { name:"Dolphin", emoji:"🐬", tag:"The social spark", strength:"You energize a group and play as you go.", shadow:"You can avoid the hard, quiet work." },
  meerkat: { name:"Meerkat", emoji:"🐒", tag:"The community guardian", strength:"You are always aware of the group.", shadow:"You can worry about everyone else's safety." },
  badger: { name:"Badger", emoji:"🦡", tag:"The direct fixer", strength:"You solve problems head-on, no fuss.", shadow:"You can be blunt when people need gentleness." },
  elephant: { name:"Elephant", emoji:"🐘", tag:"The empathetic heart", strength:"You sit with people in their pain and remember everything.", shadow:"You can carry burdens that aren't yours." },
  deer: { name:"Deer", emoji:"🦌", tag:"The gentle one", strength:"You sense tension early and give space kindly.", shadow:"You can freeze when you need to stand firm." },
  tiger: { name:"Tiger", emoji:"🐯", tag:"The fierce one", strength:"You confront pressure directly and protect your own.", shadow:"You can burn bridges in the heat of it." },
  hare: { name:"Hare", emoji:"🐇", tag:"The quick escape", strength:"You avoid conflict and move fast when needed.", shadow:"You can run from things worth facing." },
  turtle: { name:"Turtle", emoji:"🐢", tag:"The calm one", strength:"You stay steady and wait things out.", shadow:"You can retreat so far you stop moving." }
);
let scores = {}, idx = 0;
const app = document.getElementById('app);
const bar = document.querySelector('.progress > div);
function start(){ scores={}; idx=0; render(); }
function render(){
  bar.style.width = (idx/QUESTIONS.length*100)+'%';
  if(idx>=QUESTIONS.length){ showResult(); return; }
  const Q = QUESTIONS[idx];
  app.innerHTML = '<div class="q">'+Q.q+'</div><div class="answers">'+Q.a.map((a,i)=>'<button onclick="pick('+i+')">'+a.t+'</button>').join('')+'</div>';
}
function pick(i){ const a = QUESTIONS[idx].a[i]; scores[a.animal]=(scores[a.animal]||0)+1; idx++; render(); }
function showResult(){
  let best=null, top=-1;
  for(const k in scores){ if(scores[k]>top){ top=scores[k]; best=k; } }
  const A = ANIMALS[best];
  app.innerHTML = '<div class="result"><div class="emoji">'+A.emoji+'</div><h2>'+A.name+'</h2><div class="tag">'+A.tag+'</div><p><strong>Your strength:</strong> '+A.strength+'</p><p class="shadow"><strong>Your shadow:</strong> '+A.shadow+'</p></div><div class="btns"><button onclick="share()">Share</button><button class="secondary" onclick="start()">Start over</button></div>';
}
function share(){
  const A = ANIMALS[Object.keys(scores).reduce((b,k)=>scores[k]>scores[b]?k:b)];
  const text = 'My spirit animal is the '+A.name+'! '+A.emoji+' Take the quiz: '+location.href;
  if(navigator.share){ navigator.share({title:'What Is My Spirit Animal?', text:text}); }
  else { navigator.clipboard.writeText(text); alert('Copied to clipboard!'); }
}
start();
</script>
</body>
</html>
